<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LogiFlow | Forgot Password</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="login-page">

        <div class="login-card">

            <div class="login-visual">

                <div class="logo">
                    <span class="logo-mark">L</span>
                    <span class="logo-logi">Logi</span><span class="logo-flow">Flow</span>
                </div>

                <div class="visual-content">

                    <div class="visual-box">
                        LOGISTICS
                    </div>

                    <h2>Secure.</h2>
                    <h2>Simple.</h2>

                    <p>
                        Enter your registered email
                        and we'll help you recover
                        access to your LogiFlow account.
                    </p>

                </div>

            </div>


            <div class="login-form">

                <h1>Forgot Password?</h1>

                <p class="login-subtitle">
                    Enter your email to reset your password
                </p>


                <form>

                    <div class="form-group">

                        <label for="email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Your email"
                            required
                        >

                    </div>


                    <button type="submit">
                        Send Reset Link
                    </button>

                </form>


                <p class="signup-text">

                    Remember your password?

                    <a href="index.html">
                        Back to Login
                    </a>

                </p>

            </div>

        </div>

    </div>

</body>

</html>
