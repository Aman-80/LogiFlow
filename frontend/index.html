<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LogiFlow | Login</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="login-page">

        <div class="login-card">

            <div class="login-visual">

                <div class="logo">
                    <span class="logo-mark">L</span>
                    <span class="logo-logi">Logi</span><span class="logo-flow">Flow</span>
                </div>

                <div class="visual-content">

                    <div class="visual-box">
                        LOGISTICS
                    </div>

                    <h2>Move Smarter.</h2>
                    <h2>Deliver Faster.</h2>

                    <p>
                        Manage your logistics,
                        shipments and inventory
                        from one powerful platform.
                    </p>

                </div>

            </div>


            <div class="login-form">

                <h1>Welcome Back</h1>

                <p class="login-subtitle">
                    Sign in to your LogiFlow account
                </p>


                <form>

                    <div class="form-group">

                        <label for="email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Your email"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            placeholder="Your password"
                            required
                        >

                    </div>


                    <div class="forgot-password">

                        <a href="forgot-password.html">
                            Forgot password?
                        </a>

                    </div>


                    <button type="submit">
                        Login
                    </button>

                </form>


                <p class="signup-text">

                    Don't have an account?

                    <a href="signup.html">
                        Register
                    </a>

                </p>

            </div>

        </div>

    </div>

</body>

</html>
