<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LogiFlow | Register</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="login-page">

        <div class="login-card">

            <!-- LEFT SECTION -->
            <div class="login-visual">

                <div class="logo">

                    <span class="logo-mark">L</span>

                    <span class="logo-logi">Logi</span><span class="logo-flow">Flow</span>

                </div>


                <div class="visual-content">

                    <div class="visual-box">
                        LOGISTICS
                    </div>

                    <h2>Build Smarter.</h2>

                    <h2>Deliver Faster.</h2>

                    <p>
                        Create your LogiFlow account
                        and manage your logistics,
                        inventory and shipments
                        from one powerful platform.
                    </p>

                </div>

            </div>


            <!-- RIGHT REGISTER SECTION -->
            <div class="login-form">

                <h1>Create Account</h1>

                <p class="login-subtitle">
                    Register your LogiFlow account
                </p>


                <form>

                    <!-- FULL NAME -->
                    <div class="form-group">

                        <label for="name">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            placeholder="Your full name"
                            required
                        >

                    </div>


                    <!-- EMAIL -->
                    <div class="form-group">

                        <label for="email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Your email"
                            required
                        >

                    </div>


                    <!-- PASSWORD -->
                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            placeholder="Create a password"
                            required
                        >

                    </div>


                    <!-- CONFIRM PASSWORD -->
                    <div class="form-group">

                        <label for="confirm-password">
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            id="confirm-password"
                            placeholder="Confirm your password"
                            required
                        >

                    </div>


                    <!-- REGISTER BUTTON -->
                    <button type="submit">
                        Register
                    </button>

                </form>


                <!-- BACK TO LOGIN -->
                <p class="signup-text">

                    Already have an account?

                    <a href="index.html">
                        Login
                    </a>

                </p>

            </div>

        </div>

    </div>

</body>

</html>
